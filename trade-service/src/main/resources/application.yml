server:
  port: 8083
spring:
  application:
    name: trade-service
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NS:}
      config:
        namespace: ${NACOS_NS:}
        file-extension: yaml
  config:
    import:
      - optional:nacos:common.yaml
      - optional:nacos:trade-rules.yaml?refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?refreshEnabled=true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh,metrics
---
spring:
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml?placeholder-type=environment
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input
rocketmq:
  producer:
    group: trade-tx-producer
    send-message-timeout: 3000
---
spring:
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: 8720
      datasource:
        param-flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            data-id: trade-param-flow-rules.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: param-flow
