server:
  port: 8080
spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NS:}
      config:
        namespace: ${NACOS_NS:}
        file-extension: yaml
  config:
    import:
      - optional:nacos:common.yaml
      - optional:nacos:${spring.application.name}.yaml?refreshEnabled=true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
---
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user
          uri: lb://user-service
          predicates: [Path=/api/user/**]
        - id: market
          uri: lb://market-service
          predicates: [Path=/api/market/**]
        - id: market-ws
          uri: lb:ws://market-service
          predicates: [Path=/ws/market/**]
        - id: trade
          uri: lb://trade-service
          predicates: [Path=/api/trade/**]
        - id: account
          uri: lb://account-service
          predicates: [Path=/api/account/**]
        - id: rank
          uri: lb://rank-service
          predicates: [Path=/api/rank/**]
        - id: rank-ws
          uri: lb:ws://rank-service
          predicates: [Path=/ws/rank/**]
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
---
spring:
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: application/json
          response-body: '{"code":429,"msg":"请求过于频繁，请稍后再试","data":null}'
      # 规则持久化在 Nacos（group=SENTINEL_GROUP），控制台或 Nacos 修改后实时推送
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            data-id: gateway-flow-rules.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw-flow
