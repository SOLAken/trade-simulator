server:
  port: 8086
spring:
  application:
    name: rank-service
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NS:}
      config:
        namespace: ${NACOS_NS:}
        file-extension: yaml
  config:
    import:
      - optional:nacos:common.yaml
      - optional:nacos:trade-rules.yaml?refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?refreshEnabled=true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
---
spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:5432/market?reWriteBatchedInserts=true
    username: postgres
    password: ${PG_PASSWORD:postgres}
rank:
  snapshot-millis: 30000   # 全量校准周期；实时更新来自 Flink rank.update
  equity-every: 1          # 每次校准都落收益曲线（30s 粒度）
