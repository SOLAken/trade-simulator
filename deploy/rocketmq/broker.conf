brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 本地开发：服务跑在宿主机，broker 对外宣告 127.0.0.1（容器化部署时改为服务名）
brokerIP1=127.0.0.1
autoCreateTopicEnable=true
# 延时消息使用 5.x 任意时长定时消息（timerWheel），无需固定等级
timerWheelEnable=true
