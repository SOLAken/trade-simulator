# 用法（推荐用根目录 Makefile）：
#   纯 Docker 全栈：BROKER_IP=rmq-broker docker compose -f deploy/docker-compose.yml --profile infra --profile mq --profile app up -d --build
#   仅中间件（服务在宿主机跑）：./deploy/scripts/infra-up.sh
# profiles: infra（存储+注册配置）、mq（Kafka+RocketMQ）、flink（Flink 集群）、
#           app（7 个服务 + 前端，镜像内构建）、flink-jobs（向 Flink 提交作业，需同时开 flink）
# 口令等变量从仓库根目录 .env 读取（见 .env.example），未设置时使用开发默认值
# 端口：除前端 web 外，所有端口默认只绑定 127.0.0.1（BIND_ADDR）。Linux 上 Docker 发布的端口
# 会绕过 ufw/firewalld，绑定到 0.0.0.0 等于把 MySQL / Redis / Nacos 直接暴露到公网
name: tradesim

x-mem: &small
  deploy: { resources: { limits: { memory: 512m } } }

# 应用服务公共配置（app profile）：中间件地址与 K8s ConfigMap 一致，走容器网络主机名
x-svc-env: &svc-env
  NACOS_ADDR: nacos:8848
  REDIS_HOST: redis
  KAFKA_ADDR: kafka:29092
  RMQ_NAMESRV: rmq-namesrv:9876
  MYSQL_HOST: mysql-0
  MYSQL0_ADDR: mysql-0:3306
  MYSQL1_ADDR: mysql-1:3306
  PG_HOST: timescale
  SENTINEL_DASHBOARD: sentinel-dashboard:8858
  MYSQL_PASSWORD: "${MYSQL_PASSWORD:-root}"
  PG_PASSWORD: "${PG_PASSWORD:-postgres}"
  JWT_SECRET: "${JWT_SECRET:-dev-only-insecure-secret-0123456789abcdef0123}"

x-svc-build: &svc-build
  context: ..
  dockerfile: deploy/docker/app.Dockerfile
  target: service

x-svc: &svc
  profiles: [app]
  environment: *svc-env
  restart: unless-stopped
  depends_on:
    mysql-0: { condition: service_healthy }
    mysql-1: { condition: service_healthy }
    timescale: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_started }
    nacos-init: { condition: service_completed_successfully }
    rmq-init: { condition: service_completed_successfully }
  deploy: { resources: { limits: { memory: 768m } } }

services:
  # ---------------- infra ----------------
  mysql-0:
    profiles: [infra]
    image: mysql:8.0.39
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-root}" }
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --innodb-buffer-pool-size=256M, --default-time-zone=+00:00]   # 统一存 UTC，前端按本地时区展示
    ports: ["${BIND_ADDR:-127.0.0.1}:3306:3306"]
    volumes:
      - ./mysql/init-0.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql0:/var/lib/mysql
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -p$$MYSQL_ROOT_PASSWORD"], interval: 5s, retries: 30 }
    deploy: { resources: { limits: { memory: 768m } } }

  mysql-1:
    profiles: [infra]
    image: mysql:8.0.39
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-root}" }
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --innodb-buffer-pool-size=256M, --default-time-zone=+00:00]   # 统一存 UTC，前端按本地时区展示
    ports: ["${BIND_ADDR:-127.0.0.1}:3307:3306"]
    volumes:
      - ./mysql/init-1.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql1:/var/lib/mysql
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -p$$MYSQL_ROOT_PASSWORD"], interval: 5s, retries: 30 }
    deploy: { resources: { limits: { memory: 768m } } }

  timescale:
    profiles: [infra]
    image: timescale/timescaledb:2.16.1-pg16
    environment: { POSTGRES_PASSWORD: "${PG_PASSWORD:-postgres}", POSTGRES_DB: market }
    ports: ["${BIND_ADDR:-127.0.0.1}:5432:5432"]
    volumes:
      - ./timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - tsdb:/var/lib/postgresql/data
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 30 }
    deploy: { resources: { limits: { memory: 768m } } }

  redis:
    profiles: [infra]
    image: redis:7.2.5
    command: [redis-server, --appendonly, "yes", --maxmemory, 400mb]
    ports: ["${BIND_ADDR:-127.0.0.1}:6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 30 }
    <<: *small

  nacos:
    profiles: [infra]
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports: ["${BIND_ADDR:-127.0.0.1}:8848:8848", "${BIND_ADDR:-127.0.0.1}:9848:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      retries: 60
    deploy: { resources: { limits: { memory: 1g } } }

  sentinel-dashboard:
    profiles: [infra]
    image: bladex/sentinel-dashboard:1.8.8
    ports: ["${BIND_ADDR:-127.0.0.1}:8858:8858"]
    <<: *small

  # ---------------- mq ----------------
  kafka:
    profiles: [mq]
    image: apache/kafka:3.7.1
    ports: ["${BIND_ADDR:-127.0.0.1}:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    deploy: { resources: { limits: { memory: 1g } } }

  rmq-namesrv:
    profiles: [mq]
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    environment: { JAVA_OPT_EXT: "-Xms128m -Xmx256m" }
    ports: ["${BIND_ADDR:-127.0.0.1}:9876:9876"]
    <<: *small

  # broker 存储放命名卷：切换 BROKER_IP 会重建容器，没有卷时 topic、消费位点和未投递的定时消息全部丢失，
  # 存活的消费者还拿着旧位点，会跳过新队列里的第一条消息。命名卷默认属主 root，broker 以 uid 3000 运行，先修正属主
  rmq-store-init:
    profiles: [mq]
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 3000:3000 /store"]
    volumes:
      - rmqstore:/store

  rmq-broker:
    profiles: [mq]
    image: apache/rocketmq:5.3.1
    # broker 对外宣告的地址：宿主机跑服务时用 127.0.0.1（默认）；服务在容器/K8s 中时 BROKER_IP=rmq-broker
    command: ["sh", "-c", "sed 's/^brokerIP1=.*/brokerIP1=${BROKER_IP:-127.0.0.1}/' /home/rocketmq/broker.conf > /tmp/broker.conf && exec sh mqbroker -n rmq-namesrv:9876 -c /tmp/broker.conf"]
    environment: { JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m" }
    ports: ["${BIND_ADDR:-127.0.0.1}:10909:10909", "${BIND_ADDR:-127.0.0.1}:10911:10911", "${BIND_ADDR:-127.0.0.1}:10912:10912"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rmqstore:/home/rocketmq/store
    depends_on:
      rmq-namesrv: { condition: service_started }
      rmq-store-init: { condition: service_completed_successfully }
    deploy: { resources: { limits: { memory: 1g } } }

  rmq-dashboard:
    profiles: [mq]
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    platform: linux/amd64   # 官方仅有 amd64 镜像，Apple Silicon 走 Rosetta
    environment: { JAVA_OPTS: "-Drocketmq.namesrv.addr=rmq-namesrv:9876 -Xmx256m" }
    ports: ["${BIND_ADDR:-127.0.0.1}:8180:8080"]
    depends_on: [rmq-namesrv]
    <<: *small

  # ---------------- flink ----------------
  # 作业提交：./deploy/scripts/flink-submit.sh   Web UI: http://localhost:8081 被 user-service 占用，故映射到 8090
  # 命名卷默认属主 root，Flink 进程以 uid 9999 运行，写 checkpoint 会失败：启动前一次性修正属主
  flink-init:
    profiles: [flink]
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /flink-data/checkpoints /flink-data/savepoints && chown -R 9999:9999 /flink-data"]
    volumes:
      - flinkdata:/flink-data

  flink-jobmanager:
    profiles: [flink]
    depends_on:
      flink-init: { condition: service_completed_successfully }
    image: flink:1.20.0-scala_2.12-java17
    command: jobmanager
    ports: ["${BIND_ADDR:-127.0.0.1}:8090:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///flink-data/checkpoints
        state.savepoints.dir: file:///flink-data/savepoints
        execution.checkpointing.interval: 10s
    volumes:
      - flinkdata:/flink-data
      - ../flink-jobs/target:/jobs:ro
    deploy: { resources: { limits: { memory: 1200m } } }

  flink-taskmanager:
    profiles: [flink]
    image: flink:1.20.0-scala_2.12-java17
    command: taskmanager
    depends_on:
      flink-init: { condition: service_completed_successfully }
      flink-jobmanager: { condition: service_started }
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1536m
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///flink-data/checkpoints
    volumes:
      - flinkdata:/flink-data
    deploy: { resources: { limits: { memory: 1700m } } }

  # ---------------- app（纯 Docker 部署） ----------------
  # 一次性初始化：发布 Nacos 配置 / Sentinel 规则、预建 RocketMQ topic，服务等它们成功退出后才启动
  nacos-init:
    profiles: [app]
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/scripts/nacos-import.sh"]
    environment: { NACOS: "http://nacos:8848", NACOS_CONFIG_DIR: /nacos }
    volumes:
      - ./scripts/nacos-import.sh:/scripts/nacos-import.sh:ro
      - ./nacos:/nacos:ro
    depends_on: { nacos: { condition: service_healthy } }

  rmq-init:
    profiles: [app]
    image: apache/rocketmq:5.3.1
    entrypoint: ["sh", "/scripts/rocketmq-topics.sh"]
    environment: { IN_CONTAINER: "1", NAMESRV: "rmq-namesrv:9876" }
    volumes:
      - ./scripts/rocketmq-topics.sh:/scripts/rocketmq-topics.sh:ro
    depends_on: [rmq-broker]

  gateway:
    <<: *svc
    build: { <<: *svc-build, args: { MODULE: gateway } }
    image: tradesim/gateway:compose
    ports: ["${BIND_ADDR:-127.0.0.1}:8080:8080"]

  user-service:
    <<: *svc
    build: { <<: *svc-build, args: { MODULE: user-service } }
    image: tradesim/user-service:compose

  market-service:
    <<: *svc
    build: { <<: *svc-build, args: { MODULE: market-service } }
    image: tradesim/market-service:compose

  trade-service:
    <<: *svc
    build: { <<: *svc-build, args: { MODULE: trade-service } }
    image: tradesim/trade-service:compose
    environment:
      <<: *svc-env
      WORKER_ID: "0"
      # 撮合对尾延迟敏感：分代 ZGC（ZGC 堆以共享内存计入 cgroup，堆占比取 40%）
      JAVA_OPTS: "-XX:MaxRAMPercentage=40 -XX:+UseZGC -XX:+ZGenerational -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=96m -XX:MaxMetaspaceSize=192m -Xss512k -XX:+ExitOnOutOfMemoryError"
    deploy: { resources: { limits: { memory: 1g } } }

  account-service:
    <<: *svc
    build: { <<: *svc-build, args: { MODULE: account-service } }
    image: tradesim/account-service:compose

  risk-service:
    <<: *svc
    build: { <<: *svc-build, args: { MODULE: risk-service } }
    image: tradesim/risk-service:compose

  rank-service:
    <<: *svc
    build: { <<: *svc-build, args: { MODULE: rank-service } }
    image: tradesim/rank-service:compose

  web:
    profiles: [app]
    build: { context: ../frontend }
    image: tradesim/web:compose
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_PORT:-5173}:80"]
    depends_on: [gateway]
    restart: unless-stopped
    <<: *small

  flink-submit:
    profiles: [flink-jobs]
    build: { <<: *svc-build, target: flink-jobs }
    image: tradesim/flink-jobs:compose
    depends_on: [flink-jobmanager, flink-taskmanager]

volumes:
  mysql0: {}
  mysql1: {}
  tsdb: {}
  flinkdata: {}
  rmqstore: {}
