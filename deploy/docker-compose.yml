# 用法：
#   docker compose -f deploy/docker-compose.yml --profile infra --profile mq up -d
# profiles: infra（存储+注册配置）、mq（Kafka+RocketMQ）、flink、app（服务镜像，P6）
name: tradesim

x-mem: &small
  deploy: { resources: { limits: { memory: 512m } } }

services:
  # ---------------- infra ----------------
  mysql-0:
    profiles: [infra]
    image: mysql:8.0.39
    environment: { MYSQL_ROOT_PASSWORD: root, TZ: Asia/Shanghai }
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --innodb-buffer-pool-size=256M]
    ports: ["3306:3306"]
    volumes:
      - ./mysql/init-0.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql0:/var/lib/mysql
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-proot"], interval: 5s, retries: 30 }
    deploy: { resources: { limits: { memory: 768m } } }

  mysql-1:
    profiles: [infra]
    image: mysql:8.0.39
    environment: { MYSQL_ROOT_PASSWORD: root, TZ: Asia/Shanghai }
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --innodb-buffer-pool-size=256M]
    ports: ["3307:3306"]
    volumes:
      - ./mysql/init-1.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql1:/var/lib/mysql
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-proot"], interval: 5s, retries: 30 }
    deploy: { resources: { limits: { memory: 768m } } }

  timescale:
    profiles: [infra]
    image: timescale/timescaledb:2.16.1-pg16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: market }
    ports: ["5432:5432"]
    volumes:
      - ./timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - tsdb:/var/lib/postgresql/data
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 30 }
    deploy: { resources: { limits: { memory: 768m } } }

  redis:
    profiles: [infra]
    image: redis:7.2.5
    command: [redis-server, --appendonly, "yes", --maxmemory, 400mb]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 30 }
    <<: *small

  nacos:
    profiles: [infra]
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      retries: 60
    deploy: { resources: { limits: { memory: 1g } } }

  sentinel-dashboard:
    profiles: [infra]
    image: bladex/sentinel-dashboard:1.8.8
    ports: ["8858:8858"]
    <<: *small

  # ---------------- mq ----------------
  kafka:
    profiles: [mq]
    image: apache/kafka:3.7.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    deploy: { resources: { limits: { memory: 1g } } }

  rmq-namesrv:
    profiles: [mq]
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    environment: { JAVA_OPT_EXT: "-Xms128m -Xmx256m" }
    ports: ["9876:9876"]
    <<: *small

  rmq-broker:
    profiles: [mq]
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -n rmq-namesrv:9876 -c /home/rocketmq/broker.conf
    environment: { JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m" }
    ports: ["10909:10909", "10911:10911", "10912:10912"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on: [rmq-namesrv]
    deploy: { resources: { limits: { memory: 1g } } }

  rmq-dashboard:
    profiles: [mq]
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    platform: linux/amd64   # 官方仅有 amd64 镜像，Apple Silicon 走 Rosetta
    environment: { JAVA_OPTS: "-Drocketmq.namesrv.addr=rmq-namesrv:9876 -Xmx256m" }
    ports: ["8180:8080"]
    depends_on: [rmq-namesrv]
    <<: *small

volumes:
  mysql0: {}
  mysql1: {}
  tsdb: {}
