# 无状态服务：Deployment + ClusterIP Service。服务间调用走 Nacos 发现（Pod IP 直连），Service 只给探活和网关暴露用。
# 公共约定：
#  - 启动探针给足 90s（Spring Cloud + Nacos 冷启动）；就绪探针用 Spring Boot readiness 组（ApplicationRunner 完成后才 UP）
#  - preStop 先睡 5s：等网关的 LoadBalancer 缓存（TTL 5s）把实例摘掉，再开始优雅停机，滚动发布不丢请求
#  - 只设内存 limit 不设 CPU limit：CPU limit 会引发 CFS 限流导致尖刺延迟；CPU request 供调度与 HPA 计算
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: tradesim, labels: { app: gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: tradesim/gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: app-env } }, { secretRef: { name: app-secret } }]
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 768Mi } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 3, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
          lifecycle: { preStop: { exec: { command: ["sleep", "5"] } } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: tradesim }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: tradesim, labels: { app: user-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: tradesim/user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: app-env } }, { secretRef: { name: app-secret } }]
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 768Mi } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 3, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 10 }
          lifecycle: { preStop: { exec: { command: ["sleep", "5"] } } }
---
