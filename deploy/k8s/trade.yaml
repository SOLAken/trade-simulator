# trade-service 用 StatefulSet 而非 Deployment：
#  - Pod 名 trade-service-N 的序号 N 稳定不变 → 作为雪花 workerId 与撮合归属节点（TradeConfig 从 HOSTNAME 解析）
#  - 重启后同一序号的 Pod 从 MySQL 认领自己的挂单（node = N）重建订单簿
#  - 缩容掉的序号上的挂单不再撮合，收盘时由 RocketMQ 定时消息撤销并解冻（可接受的降级）
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: trade-service, namespace: tradesim, labels: { app: trade-service } }
spec:
  serviceName: trade-service
  replicas: 2
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: trade-service } }
  template:
    metadata: { labels: { app: trade-service } }
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: app
          image: tradesim/trade-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          envFrom: [{ configMapRef: { name: app-env } }, { secretRef: { name: app-secret } }]
          env:
            # 撮合对尾延迟敏感：分代 ZGC（压测最大 STW 0.24ms vs G1 21ms）。ZGC 堆以共享内存计入 cgroup，堆占比取 40%
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=40 -XX:+UseZGC -XX:+ZGenerational -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=96m -XX:MaxMetaspaceSize=192m -Xss512k -XX:+ExitOnOutOfMemoryError"
          resources: { requests: { cpu: 300m, memory: 768Mi }, limits: { memory: 1Gi } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8083 }, periodSeconds: 3, failureThreshold: 30 }
          # readiness 在 EngineRecovery（ApplicationRunner）重建订单簿完成后才 UP，恢复期间不接流量
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8083 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8083 }, periodSeconds: 10 }
          lifecycle: { preStop: { exec: { command: ["sleep", "5"] } } }
---
apiVersion: v1
kind: Service
metadata: { name: trade-service, namespace: tradesim }
spec:
  clusterIP: None
  selector: { app: trade-service }
  ports: [{ port: 8083 }]
